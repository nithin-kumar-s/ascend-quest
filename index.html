<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascend Quest">
<meta name="theme-color" content="#060b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="Ascend Quest: a gamified daily quest system for fitness, study and habits.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%E2%9A%94%EF%B8%8F%3C/text%3E%3C/svg%3E">
<title>Ascend Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e9f0fa; --bg2:#d6e4f7; --panel:rgba(255,255,255,.84); --panel-2:#f2f6fd;
  --line:#2f6fe0; --line-soft:rgba(47,111,224,.28); --accent:#1f63e0; --accent-2:#7a3cf0;
  --text:#0d1b36; --muted:#56698a; --gold:#b37500; --clear:#08946c; --fail:#d0193f;
  --rest:#a9b6cc; --glow:rgba(47,111,224,.22); --grid:rgba(47,111,224,.07); --on-accent:#ffffff;
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body:"M PLUS 1p", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#060b1a; --bg2:#0c1838; --panel:rgba(9,22,52,.8); --panel-2:rgba(18,38,84,.55);
    --line:#4cc2ff; --line-soft:rgba(76,194,255,.28); --accent:#4cc2ff; --accent-2:#a77bff;
    --text:#e4f2ff; --muted:#88a3c8; --gold:#ffcc4d; --clear:#3ff0b5; --fail:#ff4f6e;
    --rest:#33456a; --glow:rgba(76,194,255,.32); --grid:rgba(76,194,255,.055); --on-accent:#03122a;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#060b1a; --bg2:#0c1838; --panel:rgba(9,22,52,.8); --panel-2:rgba(18,38,84,.55);
  --line:#4cc2ff; --line-soft:rgba(76,194,255,.28); --accent:#4cc2ff; --accent-2:#a77bff;
  --text:#e4f2ff; --muted:#88a3c8; --gold:#ffcc4d; --clear:#3ff0b5; --fail:#ff4f6e;
  --rest:#33456a; --glow:rgba(76,194,255,.32); --grid:rgba(76,194,255,.055); --on-accent:#03122a;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; }
body{
  margin:0; min-height:100%; font-family:var(--body); color:var(--text); background:var(--bg);
  background-image: radial-gradient(1200px 600px at 80% -10%, var(--bg2), transparent 70%),
                    radial-gradient(900px 500px at -10% 110%, var(--bg2), transparent 70%);
  background-attachment:fixed; -webkit-tap-highlight-color:transparent; line-height:1.5;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:44px 44px;
  mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%);
  -webkit-mask-image:radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--bg); }
button,input{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

/* ---------- layout ---------- */
.app{ position:relative; z-index:1; max-width:1180px; margin:0 auto; padding:16px 18px 110px; }
.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:12px;
  padding:12px 4px; margin:0 -4px 8px; background:linear-gradient(var(--bg) 70%, transparent);
}
.brand{ display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
.brand-mark{
  width:38px; height:38px; flex:none; display:grid; place-items:center; color:var(--accent);
  border:1.5px solid var(--line); background:var(--panel);
  clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);
}
.brand-text{ min-width:0; }
.brand-text .who{ font-family:var(--display); font-weight:700; font-size:1.15rem; letter-spacing:.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.brand-text .sub{ font-size:.78rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.chip{
  display:inline-flex; align-items:center; gap:6px; padding:6px 10px; font-family:var(--display); font-weight:600;
  font-size:.9rem; border:1px solid var(--line-soft); background:var(--panel); white-space:nowrap;
}
.chip.streak{ color:var(--gold); }
.icon-btn{
  width:42px; height:42px; display:grid; place-items:center; border:1px solid var(--line-soft);
  background:var(--panel); color:var(--text); flex:none;
}
.icon-btn:active{ transform:scale(.95); }
.view{ display:none; }
.view.on{ display:block; animation:viewIn .28s ease-out; }
@keyframes viewIn{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none; } }
.grid-quest{ display:grid; gap:18px; grid-template-columns:1fr; }
@media (min-width:900px){ .grid-quest{ grid-template-columns:340px 1fr; align-items:start; } }

/* ---------- system window ---------- */
.win{
  position:relative; background:var(--panel); border:1px solid var(--line-soft);
  box-shadow:0 0 0 1px transparent, 0 10px 40px -18px var(--glow), inset 0 0 40px -20px var(--glow);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  padding:18px;
}
.win::before,.win::after{ content:""; position:absolute; width:22px; height:22px; pointer-events:none; }
.win::before{ top:4px; right:4px; border-top:2px solid var(--line); border-right:2px solid var(--line); }
.win::after{ bottom:4px; left:4px; border-bottom:2px solid var(--line); border-left:2px solid var(--line); }
.win-title{
  display:flex; align-items:center; gap:10px; margin:0 0 14px; font-family:var(--display); font-weight:700;
  font-size:1.05rem; letter-spacing:.14em; text-transform:uppercase; color:var(--accent);
}
.win-title .bang{
  width:24px; height:24px; display:grid; place-items:center; border:1.5px solid var(--line); font-size:.85rem;
  letter-spacing:0;
}
.win-title .right{ margin-left:auto; font-size:.82rem; letter-spacing:.04em; text-transform:none; color:var(--muted); font-weight:600; }
.stack > * + *{ margin-top:18px; }

/* ---------- player card ---------- */
.player{ display:grid; grid-template-columns:auto 1fr; gap:16px; align-items:center; }
.emblem{ width:84px; height:84px; }
.emblem text{ font-family:var(--display); font-weight:700; }
.lvl-line{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.lvl-num{ font-family:var(--display); font-weight:700; font-size:2.4rem; line-height:1; }
.lvl-lab{ font-family:var(--display); color:var(--muted); font-weight:600; }
.title-name{ color:var(--accent-2); font-weight:700; font-size:.95rem; }
.bar{ height:10px; background:var(--panel-2); border:1px solid var(--line-soft); position:relative; overflow:hidden; margin-top:10px; }
.bar > i{ position:absolute; inset:0 auto 0 0; background:linear-gradient(90deg, var(--accent-2), var(--accent)); transition:width .6s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 12px var(--glow); }
.bar-cap{ display:flex; justify-content:space-between; font-size:.78rem; color:var(--muted); margin-top:5px; font-family:var(--display); }
.week{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:16px; }
.week .d{ text-align:center; font-size:.72rem; color:var(--muted); font-family:var(--display); }
.week .pip{ height:26px; margin-top:4px; display:grid; place-items:center; border:1px solid var(--line-soft); background:var(--panel-2); font-size:.8rem; }
.pip.clear{ background:color-mix(in srgb, var(--clear) 22%, transparent); border-color:var(--clear); color:var(--clear); }
.pip.fail{ background:color-mix(in srgb, var(--fail) 18%, transparent); border-color:var(--fail); color:var(--fail); }
.pip.active{ border-color:var(--accent); color:var(--accent); animation:pulse 1.8s ease-in-out infinite; }
.pip.rest{ opacity:.55; }
@keyframes pulse{ 50%{ box-shadow:0 0 0 3px var(--glow); } }
.mini-stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:16px; }
.mini-stats div{ text-align:center; border:1px solid var(--line-soft); background:var(--panel-2); padding:6px 2px; }
.mini-stats b{ display:block; font-family:var(--display); font-size:1.1rem; }
.mini-stats span{ font-size:.7rem; color:var(--muted); font-family:var(--display); letter-spacing:.06em; }

/* ---------- daily quest ---------- */
.quest-head{ display:flex; flex-wrap:wrap; gap:10px 18px; align-items:flex-end; justify-content:space-between; margin-bottom:16px; }
.quest-date{ font-family:var(--display); font-size:1.5rem; font-weight:700; line-height:1.2; }
.quest-sub{ color:var(--muted); font-size:.9rem; }
.timer{ text-align:right; }
.timer .t{ font-family:var(--display); font-size:1.5rem; font-weight:700; font-variant-numeric:tabular-nums; color:var(--fail); }
.timer .t.safe{ color:var(--clear); }
.timer small{ display:block; color:var(--muted); font-size:.78rem; }
.progress-ring{ display:flex; align-items:center; gap:14px; margin:4px 0 16px; }
.progress-ring .count{ font-family:var(--display); font-size:1.05rem; font-weight:600; }
.progress-ring .bar{ flex:1; margin:0; height:12px; }
.quests{ list-style:none; margin:0; padding:0; display:grid; gap:10px; }
.q{
  position:relative; display:grid; grid-template-columns:auto 1fr auto; gap:14px; align-items:center;
  width:100%; text-align:left; padding:14px 16px; min-height:64px;
  background:var(--panel-2); border:1px solid var(--line-soft);
  transition:border-color .2s, background .2s, transform .12s;
}
.q:active{ transform:scale(.99); }
.q .box{
  width:30px; height:30px; border:2px solid var(--line); display:grid; place-items:center; color:transparent;
  transition:background .2s, color .2s, box-shadow .2s;
}
.q .box svg{ width:18px; height:18px; }
.q .nm{ font-weight:500; font-size:1.05rem; overflow-wrap:anywhere; }
.q .meta{ display:flex; gap:8px; margin-top:3px; font-size:.78rem; color:var(--muted); font-family:var(--display); }
.q .xp{ font-family:var(--display); font-weight:700; color:var(--accent); white-space:nowrap; }
.q.done{ border-color:var(--clear); background:color-mix(in srgb, var(--clear) 9%, var(--panel-2)); }
.q.done .box{ background:var(--clear); border-color:var(--clear); color:var(--on-accent); box-shadow:0 0 14px color-mix(in srgb, var(--clear) 60%, transparent); }
.q.done .nm{ text-decoration:line-through; text-decoration-color:color-mix(in srgb, var(--text) 40%, transparent); color:var(--muted); }
.q.done .xp{ color:var(--clear); }
.q.pop .box{ animation:pop .35s ease-out; }
@keyframes pop{ 40%{ transform:scale(1.3); } }
.tag{ display:inline-flex; align-items:center; gap:4px; padding:0 6px; border:1px solid var(--line-soft); }
.rk{ font-weight:700; }
.rk-E{ color:var(--muted); } .rk-D{ color:var(--clear); } .rk-C{ color:var(--accent); }
.rk-B{ color:var(--accent-2); } .rk-A{ color:var(--gold); } .rk-S{ color:var(--fail); }
.warn{
  margin-top:16px; padding:12px 14px; border-left:3px solid var(--fail); background:color-mix(in srgb, var(--fail) 8%, transparent);
  font-size:.88rem; color:var(--text);
}
.warn.ok{ border-color:var(--clear); background:color-mix(in srgb, var(--clear) 10%, transparent); }
.empty{ text-align:center; padding:26px 10px; }
.empty p{ color:var(--muted); margin:6px 0 16px; }
.float-xp{
  position:fixed; z-index:60; pointer-events:none; font-family:var(--display); font-weight:700; color:var(--clear);
  font-size:1.1rem; text-shadow:0 0 10px color-mix(in srgb, var(--clear) 70%, transparent); animation:floatUp 1s ease-out forwards;
}
@keyframes floatUp{ from{ opacity:1; transform:translate(-50%,0);} to{ opacity:0; transform:translate(-50%,-48px);} }

/* ---------- buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:46px; padding:0 20px;
  font-family:var(--display); font-weight:700; letter-spacing:.06em; border:1.5px solid var(--line);
  background:var(--accent); color:var(--on-accent);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
}
.btn.ghost{ background:transparent; color:var(--accent); }
.btn.danger{ background:transparent; color:var(--fail); border-color:var(--fail); }
.btn:active{ transform:scale(.97); }
.btn.wide{ width:100%; }

/* ---------- calendar ---------- */
.cal-head{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
.cal-head h2{ margin:0; flex:1; font-family:var(--display); font-size:1.4rem; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.cal-grid .wd{ text-align:center; font-family:var(--display); font-size:.78rem; color:var(--muted); padding-bottom:4px; }
.cell{
  aspect-ratio:1/1; min-height:44px; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border:1px solid var(--line-soft); background:var(--panel-2); font-family:var(--display); font-weight:600; padding:2px;
}
.cell .n{ font-size:1rem; }
.cell .s{ font-size:.95rem; line-height:1; margin-top:2px; height:1em; }
.cell.blank{ visibility:hidden; }
.cell.future{ opacity:.45; }
.cell.none{ opacity:.6; }
.cell.clear{ border-color:var(--clear); background:color-mix(in srgb, var(--clear) 20%, var(--panel-2)); color:var(--clear); }
.cell.fail{ border-color:var(--fail); background:color-mix(in srgb, var(--fail) 15%, var(--panel-2)); color:var(--fail); }
.cell.active{ border-color:var(--accent); color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
.cell.rest{ color:var(--muted); }
.cell.today::after{ content:""; position:absolute; bottom:4px; width:6px; height:6px; background:currentColor; border-radius:50%; }
.legend{ display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:14px; font-size:.82rem; color:var(--muted); }
.legend span::before{ content:""; display:inline-block; width:10px; height:10px; margin-right:6px; vertical-align:-1px; border:1px solid currentColor; }
.legend .l-clear{ color:var(--clear); } .legend .l-fail{ color:var(--fail); } .legend .l-active{ color:var(--accent); } .legend .l-rest{ color:var(--muted); }
.legend span{ color:var(--text); }
.legend .l-clear::before{ background:var(--clear); border-color:var(--clear);} .legend .l-fail::before{ background:var(--fail); border-color:var(--fail);}
.legend .l-active::before{ border-color:var(--accent);} .legend .l-rest::before{ border-color:var(--rest);}
.month-sum{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px; }
.kv{ border:1px solid var(--line-soft); background:var(--panel-2); padding:10px 12px; }
.kv b{ display:block; font-family:var(--display); font-size:1.4rem; line-height:1.2; }
.kv span{ font-size:.8rem; color:var(--muted); }
@media (min-width:900px){ .cal-wrap{ display:grid; grid-template-columns:1fr 300px; gap:18px; align-items:start; } }

/* ---------- status ---------- */
.status-grid{ display:grid; gap:18px; }
@media (min-width:900px){ .status-grid{ grid-template-columns:1fr 1fr; } }
.radar{ width:100%; max-width:340px; display:block; margin:0 auto; }
.radar text{ font-family:var(--display); font-weight:700; font-size:11px; fill:var(--muted); }
.stat-list{ display:grid; gap:8px; margin-top:12px; }
.stat-row{ display:grid; grid-template-columns:48px 1fr 42px; gap:10px; align-items:center; font-family:var(--display); }
.stat-row .k{ font-weight:700; color:var(--accent); }
.stat-row .bar{ margin:0; height:8px; }
.stat-row .v{ text-align:right; font-weight:700; }
.stat-row small{ grid-column:2 / 4; color:var(--muted); font-family:var(--body); font-size:.76rem; margin-top:-6px; }
.records{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
@media (min-width:600px){ .records{ grid-template-columns:repeat(3,1fr); } }
.achs{ display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
.ach{ padding:12px; border:1px solid var(--line-soft); background:var(--panel-2); }
.ach .ic{ font-size:1.3rem; }
.ach b{ display:block; font-family:var(--display); margin-top:4px; }
.ach span{ font-size:.78rem; color:var(--muted); }
.ach.locked{ opacity:.45; filter:grayscale(1); }
.ach.got{ border-color:var(--accent-2); box-shadow:inset 0 0 20px -10px var(--accent-2); }

/* ---------- board ---------- */
.board-list{ list-style:none; padding:0; margin:0; display:grid; gap:10px; }
@media (min-width:700px){ .board-list{ grid-template-columns:1fr 1fr; } }
.task-card{
  width:100%; text-align:left; display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center;
  padding:14px; border:1px solid var(--line-soft); background:var(--panel-2); min-height:64px;
}
.task-card .st{ width:46px; height:46px; display:grid; place-items:center; border:1.5px solid var(--line); font-family:var(--display); font-weight:700; font-size:.82rem; color:var(--accent); }
.task-card .nm{ font-weight:500; overflow-wrap:anywhere; }
.task-card .meta{ font-size:.8rem; color:var(--muted); }
.task-card .xp{ font-family:var(--display); font-weight:700; }

/* ---------- tabs ---------- */
.tabs{
  position:fixed; left:0; right:0; bottom:0; z-index:25; display:flex; justify-content:center;
  padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));
  background:color-mix(in srgb, var(--bg) 88%, transparent); border-top:1px solid var(--line-soft);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.tabs-in{ display:grid; grid-template-columns:repeat(4,1fr); width:100%; max-width:620px; gap:6px; }
.tab{
  display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 4px; border:1px solid transparent;
  background:none; color:var(--muted); font-family:var(--display); font-weight:600; font-size:.78rem;
}
.tab svg{ width:24px; height:24px; }
.tab.on{ color:var(--accent); border-color:var(--line-soft); background:var(--panel); }

/* ---------- sheets & overlays ---------- */
.scrim{ position:fixed; inset:0; z-index:40; background:rgba(2,6,18,.55); display:none; align-items:flex-end; justify-content:center; padding:16px; }
@media (min-width:700px){ .scrim{ align-items:center; } }
.scrim.on{ display:flex; animation:fade .2s ease-out; }
@keyframes fade{ from{ opacity:0; } }
.sheet{ width:100%; max-width:560px; max-height:calc(100% - 20px); overflow:auto; margin-bottom:env(safe-area-inset-bottom,0px); animation:rise .28s cubic-bezier(.2,.8,.2,1); }
@keyframes rise{ from{ transform:translateY(24px); opacity:0; } }
.field{ margin-bottom:16px; }
.field > label, .field > .lab{ display:block; font-family:var(--display); font-weight:600; margin-bottom:6px; }
.field .hint{ font-size:.8rem; color:var(--muted); margin-top:4px; }
.inp{
  width:100%; min-height:48px; padding:10px 14px; font-size:1.05rem; background:var(--panel-2); border:1.5px solid var(--line-soft);
}
.inp:focus{ border-color:var(--line); outline:none; box-shadow:0 0 0 3px var(--glow); }
.opts{ display:flex; flex-wrap:wrap; gap:8px; }
.opt{
  min-height:44px; min-width:44px; padding:6px 12px; border:1.5px solid var(--line-soft); background:var(--panel-2);
  font-family:var(--display); font-weight:600; display:inline-flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2;
}
.opt small{ font-size:.7rem; color:var(--muted); font-weight:500; }
.opt[aria-pressed="true"]{ border-color:var(--accent); background:color-mix(in srgb, var(--accent) 16%, var(--panel-2)); color:var(--accent); }
.opt[aria-pressed="true"] small{ color:var(--accent); }
.row-btns{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; }
.row-btns .btn{ flex:1; }
.err{ color:var(--fail); font-size:.85rem; margin-top:6px; min-height:1.2em; }

.announce{ position:fixed; inset:0; z-index:50; display:none; place-items:center; padding:20px; background:rgba(2,6,18,.7); }
.announce.on{ display:grid; animation:fade .25s ease-out; }
.ann-win{ width:100%; max-width:440px; text-align:center; padding:28px 22px 22px; animation:zoom .45s cubic-bezier(.2,1.4,.3,1); }
@keyframes zoom{ from{ transform:scale(.7); opacity:0; } }
.ann-kicker{ font-family:var(--display); font-weight:700; letter-spacing:.22em; text-transform:uppercase; font-size:.85rem; }
.ann-title{ font-family:var(--display); font-weight:700; font-size:2.1rem; line-height:1.15; margin:8px 0 10px; }
.ann-body{ color:var(--muted); }
.ann-body .rew{ display:grid; gap:6px; margin:14px auto 0; max-width:280px; text-align:left; font-family:var(--display); }
.ann-body .rew div{ display:flex; justify-content:space-between; color:var(--text); border-bottom:1px dashed var(--line-soft); padding-bottom:4px; }
.ann-win.k-clear{ --line:var(--clear); } .ann-win.k-clear .ann-kicker, .ann-win.k-clear .ann-title{ color:var(--clear); }
.ann-win.k-level{ --line:var(--gold); } .ann-win.k-level .ann-kicker, .ann-win.k-level .ann-title{ color:var(--gold); }
.ann-win.k-fail{ --line:var(--fail); } .ann-win.k-fail .ann-kicker, .ann-win.k-fail .ann-title{ color:var(--fail); }
.ann-win.k-ach{ --line:var(--accent-2); } .ann-win.k-ach .ann-kicker, .ann-win.k-ach .ann-title{ color:var(--accent-2); }
.ann-win .btn{ margin-top:22px; }
.ann-win.k-level .btn{ background:var(--gold); border-color:var(--gold); }
.ann-win.k-clear .btn{ background:var(--clear); border-color:var(--clear); }
.ann-win.k-fail .btn{ background:var(--fail); border-color:var(--fail); color:#fff; }
.ann-win.k-ach .btn{ background:var(--accent-2); border-color:var(--accent-2); color:#fff; }
.big-lv{ font-family:var(--display); font-weight:700; font-size:4.2rem; line-height:1; color:var(--gold); text-shadow:0 0 24px color-mix(in srgb, var(--gold) 60%, transparent); }
.shards{ position:fixed; inset:0; pointer-events:none; z-index:55; overflow:hidden; }
.shard{ position:absolute; width:8px; height:14px; top:50%; left:50%; animation:burst 1.1s ease-out forwards; }
@keyframes burst{ to{ transform:translate(var(--dx),var(--dy)) rotate(var(--r)); opacity:0; } }

.toast{
  position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 14px); transform:translateX(-50%); z-index:70;
  padding:10px 16px; font-family:var(--display); font-weight:600; background:var(--panel); border:1px solid var(--accent-2);
  color:var(--text); box-shadow:0 8px 30px -10px var(--glow); animation:toastIn .3s ease-out; max-width:calc(100% - 32px);
}
@keyframes toastIn{ from{ transform:translate(-50%,-20px); opacity:0; } }
.sync-note{ font-size:.82rem; color:var(--muted); }
.day-items{ list-style:none; padding:0; margin:0; display:grid; gap:8px; }
.day-items li{ display:flex; gap:10px; align-items:center; padding:10px 12px; border:1px solid var(--line-soft); background:var(--panel-2); }
.day-items .ok{ color:var(--clear); font-weight:700; } .day-items .no{ color:var(--fail); font-weight:700; }
.status-badge{ display:inline-block; padding:2px 10px; font-family:var(--display); font-weight:700; border:1px solid currentColor; }

/* ---------- small-screen fit ---------- */
.cal-grid, .week{ grid-template-columns:repeat(7,minmax(0,1fr)); }
.mini-stats{ grid-template-columns:repeat(5,minmax(0,1fr)); }
.cell{ min-width:0; min-height:0; padding:0; overflow:hidden; }
.win-title{ flex-wrap:wrap; }
@media (max-width:520px){
  .app{ padding:10px 10px 104px; }
  .win{ padding:14px; }
  .grid-quest, .status-grid, .stack > * + *{ gap:12px; }
  .cal-grid{ gap:4px; }
  .cell .n{ font-size:.85rem; }
  .cell .s{ font-size:.72rem; }
  .cell.today::after{ bottom:2px; width:4px; height:4px; }
  .cal-head h2{ font-size:1.15rem; }
  .cal-head .icon-btn{ width:38px; height:38px; }
  .month-sum{ gap:6px; }
  .kv{ padding:8px; } .kv b{ font-size:1.15rem; }
  .legend{ gap:6px 12px; font-size:.76rem; }
  .quest-date{ font-size:1.2rem; }
  .timer .t{ font-size:1.2rem; }
  .q{ padding:12px; gap:10px; }
  .q .nm{ font-size:.98rem; }
  .mini-stats{ gap:4px; } .mini-stats b{ font-size:1rem; }
  .week{ gap:4px; }
  .lvl-num{ font-size:2rem; }
  .tm-big{ font-size:2.6rem; }
  .two{ grid-template-columns:1fr; }
  .topbar{ gap:8px; }
  .chip.streak{ padding:6px 8px; }
  .brand-mark{ display:none; }
}
@media (max-width:360px){
  .cal-grid{ gap:3px; }
  .cell .s{ font-size:.62rem; }
  .icon-btn{ width:38px; height:38px; }
}
.cal-wrap > * + *{ margin-top:12px; }
@media (min-width:900px){ .cal-wrap > * + *{ margin-top:0; } }
@media (max-width:520px){ .cell.today::after{ display:none; } }
.test-bar{ position:fixed; left:10px; bottom:calc(84px + env(safe-area-inset-bottom,0px)); z-index:26; display:flex; gap:6px; align-items:center; padding:6px 8px; background:var(--panel); border:1px dashed var(--gold); font-family:var(--display); font-weight:700; font-size:.8rem; color:var(--gold); }
.test-bar button{ background:var(--gold); color:#1a1200; border:none; padding:6px 10px; font-family:var(--display); font-weight:700; }
.test-bar button.ghost{ background:transparent; color:var(--gold); border:1px solid var(--gold); }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
}

/* ---------- system mode additions ---------- */
.sec-head{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin:20px 0 10px; font-family:var(--display); font-weight:700; font-size:1rem; }
.sec-head:first-of-type{ margin-top:4px; }
.sec-head .chip{ font-size:.78rem; padding:3px 8px; }
.chip.easy{ color:var(--clear); border-color:var(--clear); }
.chip.pen{ color:var(--fail); border-color:var(--fail); }
.q .meta{ flex-wrap:wrap; }
.q .sub{ color:var(--muted); font-family:var(--body); }
.q.pen{ border-color:var(--fail); background:color-mix(in srgb, var(--fail) 8%, var(--panel-2)); }
.q.pen .box{ border-color:var(--fail); }
.q.pen.done{ border-color:var(--clear); }
.q .xp small{ display:block; text-align:right; color:var(--muted); font-weight:600; }
.banner{ margin:0 0 14px; padding:12px 14px; border:1px solid var(--fail); background:color-mix(in srgb, var(--fail) 10%, transparent); font-size:.9rem; }
.banner b{ font-family:var(--display); color:var(--fail); }
.banner.passb{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 10%, transparent); }
.banner.passb b{ color:var(--accent-2); }
.pass-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:16px; font-size:.85rem; color:var(--muted); }
.pass-row .btn{ min-height:40px; font-size:.85rem; padding:0 14px; }
.sheet.wide{ max-width:680px; }
.ex-card{ border:1px solid var(--line-soft); background:var(--panel-2); padding:14px; margin-bottom:12px; }
.ex-card.done{ border-color:var(--clear); }
.ex-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; flex-wrap:wrap; }
.ex-lad{ font-family:var(--display); font-size:.78rem; color:var(--muted); letter-spacing:.06em; }
.ex-name{ font-family:var(--display); font-weight:700; font-size:1.15rem; }
.ex-target{ font-family:var(--display); font-weight:700; color:var(--accent); white-space:nowrap; }
.ex-how{ font-size:.86rem; color:var(--muted); margin:6px 0 10px; }
.ex-safe{ font-size:.82rem; color:var(--gold); margin:-4px 0 10px; }
.pills{ display:flex; gap:8px; flex-wrap:wrap; }
.pill{ min-width:64px; min-height:48px; padding:4px 10px; border:1.5px solid var(--line-soft); background:var(--panel); font-family:var(--display); font-weight:700; }
.pill.on{ background:var(--clear); border-color:var(--clear); color:var(--on-accent); }
.restbar{ position:sticky; top:-18px; z-index:2; margin:-18px -18px 14px; padding:10px 18px; background:var(--accent); color:var(--on-accent); font-family:var(--display); font-weight:700; display:none; align-items:center; gap:12px; }
.restbar.on{ display:flex; }
.restbar .rb{ flex:1; height:6px; background:color-mix(in srgb, var(--on-accent) 30%, transparent); position:relative; }
.restbar .rb i{ position:absolute; inset:0 auto 0 0; background:var(--on-accent); }
.restbar button{ background:none; border:1.5px solid var(--on-accent); color:var(--on-accent); padding:4px 10px; font-family:var(--display); font-weight:700; }
.rate{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.rate .opt{ min-height:56px; }
.warm{ border:1px dashed var(--line-soft); padding:12px 14px; margin-bottom:12px; font-size:.88rem; }
.warm ul, .routine{ margin:6px 0 0; padding-left:18px; }
.routine li{ margin:6px 0; }
.routine b{ font-family:var(--display); }
.tm-big{ font-family:var(--display); font-weight:700; font-size:3.4rem; text-align:center; font-variant-numeric:tabular-nums; line-height:1.1; margin:10px 0 4px; }
.tm-cap{ text-align:center; color:var(--muted); margin-bottom:12px; }
.lad-row{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; padding:10px 0; border-bottom:1px dashed var(--line-soft); }
.lad-row:last-child{ border-bottom:none; }
.lad-row .ln{ font-family:var(--display); font-weight:700; }
.lad-row .ll{ font-size:.75rem; color:var(--muted); font-family:var(--display); }
.lad-row .lt{ font-family:var(--display); font-weight:700; color:var(--accent); text-align:right; }
.lad-row .bar{ grid-column:1/-1; margin:2px 0 0; height:6px; }
.lad-row .nx{ grid-column:1/-1; font-size:.78rem; color:var(--muted); }
.chart{ width:100%; height:auto; display:block; }
.chart text{ font-family:var(--display); font-size:13px; font-weight:700; fill:var(--muted); }
.cell.pass{ color:var(--accent-2); border-color:var(--accent-2); }
.legend .l-pass{ color:var(--text); } .legend .l-pass::before{ border-color:var(--accent-2); background:color-mix(in srgb, var(--accent-2) 30%, transparent); }
.pip.pass{ border-color:var(--accent-2); color:var(--accent-2); }
.offer li{ margin:6px 0; }
.two{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">

<script>
(function(){
"use strict";
/* ===================== test mode (open the file with #test at the end of the address) ===================== */
const TEST = /[?&]test\b/.test(location.search) || location.hash === "#test";
const OFF_KEY = "ascend-quest-test-offset";
const RealDate = window.Date;
let OFF = 0;
if(TEST){ try{ OFF = +localStorage.getItem(OFF_KEY) || 0; }catch(e){} }
class QDate extends RealDate{
  constructor(...a){ if(a.length) super(...a); else super(RealDate.now() + OFF*86400000); }
  static now(){ return RealDate.now() + OFF*86400000; }
}
const Date = TEST ? QDate : RealDate;
const APP_NAME = "Ascend Quest";

/* ===================== constants ===================== */
const LS_KEY = TEST ? "ascend-quest-test" : "ascend-quest-v1";
const XP  = {E:10, D:15, C:20, B:30, A:40, S:60};
const PTS = {E:1, D:1, C:2, B:2, A:3, S:4};
const RANK_HINT = {E:"Tiny", D:"Easy", C:"Normal", B:"Hard", A:"Brutal", S:"Legendary"};
const STATS = [
  {k:"STR", name:"Strength",     hint:"Workouts, sport, physical effort"},
  {k:"INT", name:"Intelligence", hint:"Study, reading, coding"},
  {k:"AGI", name:"Agility",      hint:"Steps, walking, quick wins"},
  {k:"VIT", name:"Vitality",     hint:"Sleep, food, water, health"},
  {k:"SPR", name:"Spirit",       hint:"Meditation, journaling, creative work"}
];
const WD = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const TITLES = [
  [1,"Awakened"],[5,"Wanderer"],[10,"Limit Breaker"],[15,"Iron Will"],[20,"Blade of Dawn"],
  [30,"Storm Caller"],[40,"Sky Piercer"],[55,"Unbound"],[70,"Sovereign"],[90,"Eternal"]
];
const ACHS = [
  {id:"first",  ic:"⚔️", name:"First clear",       desc:"Complete every quest in a day", test:d=>d.clears>=1},
  {id:"s3",     ic:"🔥", name:"Momentum",          desc:"Reach a 3-day streak",          test:d=>d.best>=3},
  {id:"s7",     ic:"🗡️", name:"Unbroken week",     desc:"Reach a 7-day streak",          test:d=>d.best>=7},
  {id:"s30",    ic:"🛡️", name:"Iron discipline",   desc:"Reach a 30-day streak",         test:d=>d.best>=30},
  {id:"s100",   ic:"👑", name:"Living legend",     desc:"Reach a 100-day streak",        test:d=>d.best>=100},
  {id:"t50",    ic:"📜", name:"Fifty down",        desc:"Finish 50 quests",              test:d=>d.tasksDone>=50},
  {id:"t250",   ic:"🏹", name:"Quest hunter",      desc:"Finish 250 quests",             test:d=>d.tasksDone>=250},
  {id:"t1000",  ic:"🌌", name:"Thousand trials",   desc:"Finish 1,000 quests",           test:d=>d.tasksDone>=1000},
  {id:"l10",    ic:"🚪", name:"Limit breaker",      desc:"Reach level 10",                test:d=>d.level>=10},
  {id:"l25",    ic:"💠", name:"Elite",             desc:"Reach level 25",                test:d=>d.level>=25},
  {id:"l50",    ic:"🌠", name:"Ascendant",         desc:"Reach level 50",                test:d=>d.level>=50},
  {id:"spec",   ic:"💪", name:"Specialist",        desc:"Raise any stat to 50",          test:d=>Math.max.apply(null,Object.values(d.stats))>=50},
  {id:"bal",    ic:"☯️", name:"Balanced build",    desc:"Raise every stat to 25",        test:d=>Object.values(d.stats).every(v=>v>=25)},
  {id:"back",   ic:"🌅", name:"Comeback",          desc:"Clear a day right after failing one", test:d=>d.comeback},
  {id:"srank",  ic:"⚡", name:"S-rank slayer",     desc:"Finish an S-rank quest",        test:d=>d.sDone>0}
];

/* ----- System mode training ladders ----- */
const LADDERS = {
  push:{label:"Push", levels:[
    {n:"Wall push-up", u:"reps", a:8, b:12, st:1, how:"Stand an arm’s length from a wall, hands at chest height. Lower your chest toward the wall with elbows at about 45°, then press back. Keep your body in one straight line."},
    {n:"Counter incline push-up", u:"reps", a:8, b:12, st:1, how:"Hands on a kitchen counter or sturdy desk, feet stepped back. Lower your chest to the edge and press up. Squeeze your glutes so your hips don’t sag."},
    {n:"Sofa incline push-up", u:"reps", a:8, b:12, st:1, how:"Hands on a sofa seat or bed edge (lower is harder). Same form: straight body, chest to the edge, elbows angled back, not flared out."},
    {n:"Knee push-up", u:"reps", a:6, b:12, st:1, how:"On the floor with knees down, body straight from knees to head. Lower your chest close to the floor, then press up. Don’t let your hips pike up."},
    {n:"Full push-up", u:"reps", a:3, b:12, st:1, how:"Hands slightly wider than shoulders, body rigid from heels to head. Lower until your chest is a fist’s height from the floor. Quality beats speed."},
    {n:"Decline push-up", u:"reps", a:6, b:15, st:1, how:"Feet up on a chair or sofa, hands on the floor. Puts more load on your shoulders and upper chest. Keep your core tight the whole time."}
  ]},
  squat:{label:"Legs", levels:[
    {n:"Chair sit-to-stand", u:"reps", a:8, b:12, st:1, how:"Sit on a chair, feet flat and shoulder-width apart. Stand up without using your hands, then sit back down slowly over 2 seconds."},
    {n:"Bodyweight squat", u:"reps", a:8, b:15, st:1, how:"Feet shoulder-width, toes slightly out. Sit your hips back and down until thighs are about parallel, knees tracking over your toes. Drive up through your heels."},
    {n:"Pause squat", u:"reps", a:8, b:12, st:1, how:"A normal squat, but hold the bottom position for 2 full seconds before standing. Builds strength where it’s hardest."},
    {n:"Reverse lunge", u:"reps/leg", a:6, b:12, st:1, how:"Step one foot back and lower until both knees are near 90°. Push through the front heel to return. Alternate legs."},
    {n:"Split squat", u:"reps/leg", a:6, b:12, st:1, how:"Stand in a long stride and stay there. Lower your back knee toward the floor, then rise. Do all reps on one side, then switch."},
    {n:"Bulgarian split squat", u:"reps/leg", a:6, b:12, st:1, how:"Rear foot up on a chair or sofa behind you. Lower straight down on the front leg, then drive up. Hold a wall for balance at first."},
    {n:"Backpack Bulgarian split squat", u:"reps/leg", a:6, b:12, st:1, load:true, how:"Same as the Bulgarian split squat, wearing a backpack loaded with books. Add a book each time you reach the top of the range."}
  ]},
  bar:{label:"Pull-up bar", rest:90, levels:[
    {n:"Dead hang", u:"sec", a:10, b:30, st:5, how:"Grip the bar shoulder-width, lift your feet, arms straight. Relax your body and breathe. Step down before your grip slips."},
    {n:"Scapular pulls", u:"reps", a:5, b:10, st:1, how:"From a dead hang, keep your arms straight and pull your shoulder blades down and back so your body rises a few centimetres. Lower with control."},
    {n:"Flexed-arm hang", u:"sec", a:5, b:20, st:5, how:"Use a chair to get your chin above the bar. Hold there with chest up and elbows tucked. Step down when you start to sink."},
    {n:"Negative pull-up", u:"reps", a:3, b:6, st:1, how:"Step up so your chin is over the bar, lift your feet, and lower yourself as slowly as you can (aim for 3–5 seconds). Step back up and repeat."},
    {n:"Assisted pull-up", u:"reps", a:5, b:10, st:1, how:"Put a chair under the bar and keep one or both feet on it. Pull up, using your legs only as much as you need."},
    {n:"Chin-up", u:"reps", a:1, b:8, st:1, how:"Palms facing you, hands shoulder-width. Pull until your chin clears the bar, then lower all the way with control. Singles are fine at first."},
    {n:"Pull-up", u:"reps", a:1, b:10, st:1, how:"Palms facing away, hands slightly wider than shoulders. Pull your chest toward the bar, lower fully. No swinging."}

function freshSys(){ return {on:false, start:null, base:null, offered:false, seen:{lv:{}, deloads:0, phase:1, ms:[]}}; }
function fresh(){ return {v:2, name:"", theme:"auto", sound:true, tasks:[], days:{}, ack:null, seenAch:[], updatedAt:0, mu:{}, sys:freshSys()}; }
function normalize(){
  S.sys = Object.assign(freshSys(), S.sys||{});
  S.sys.seen = Object.assign({lv:{}, deloads:0, phase:1, ms:[]}, S.sys.seen||{});
  if(S.agreed === undefined) S.agreed = false;
  if(S.lastBackup === undefined) S.lastBackup = null;
  S.mu = S.mu || {}; S.seenAch = S.seenAch || []; S.tasks = S.tasks || []; S.days = S.days || {};

/* ----- cloud sync: one meta document + one document per month ----- */
let cloud = null, syncMode = "local", pushTimer = null;
const pushed = {}, chains = {};
function save(){
  S.updatedAt = Date.now(); touch(todayKey());
  persistLocal();
  if(cloud){ clearTimeout(pushTimer); pushTimer = setTimeout(push, 800); }
}
function write(ref, data){
  const p = ref.path;
  chains[p] = (chains[p]||Promise.resolve()).then(()=>ref.set(data)).catch(()=>{});
  return chains[p];
}
function monthDays(ym){ const o={}; Object.keys(S.days).forEach(k=>{ if(k.slice(0,7)===ym) o[k]=S.days[k]; }); return o; }
function push(){
  if(!cloud) return;
  const meta = JSON.parse(JSON.stringify(S)); delete meta.days;
  write(cloud.main, meta);
  Object.keys(S.mu).forEach(ym=>{
    if(S.mu[ym] > (pushed[ym]||0)){
      pushed[ym] = S.mu[ym];
      write(cloud.months.doc(ym), {mu:S.mu[ym], days:JSON.parse(JSON.stringify(monthDays(ym)))});
    }
  });
}
function mergeRemote(remote, rmonths){
  let changed = false;
  Object.keys(rmonths).forEach(ym=>{
    const d = rmonths[ym]; pushed[ym] = Math.max(pushed[ym]||0, d.mu||0);
    if((d.mu||0) > (S.mu[ym]||0)){
      Object.keys(S.days).forEach(k=>{ if(k.slice(0,7)===ym) delete S.days[k]; });
      Object.assign(S.days, JSON.parse(JSON.stringify(d.days||{})));
      S.mu[ym] = d.mu; changed = true;
    }
  });
  if(remote && (remote.updatedAt||0) > (S.updatedAt||0)){
    const days = S.days, mu = S.mu, rm = remote.mu || {};
    Object.keys(mu).forEach(ym=>{
      if(!(ym in rm) && !(ym in rmonths) && mu[ym] < remote.updatedAt){
        Object.keys(days).forEach(k=>{ if(k.slice(0,7)===ym) delete days[k]; });
        delete mu[ym];
      }
    });
    const m = JSON.parse(JSON.stringify(remote)); delete m.days;
    S = Object.assign(fresh(), m); S.days = days; S.mu = Object.assign({}, rm, mu);
    normalize(); changed = true;
  }
  return changed;
}
async function pullCloud(){
  const res = await Promise.all([cloud.main.get(), cloud.months.get()]);
  const remote = res[0].exists ? res[0].data() : null;
  const rmonths = {};
  res[1].docs.forEach(d=>{ if(d.exists) rmonths[d.id] = d.data(); });
  if(remote && remote.days){
    Object.keys(remote.days).forEach(k=>{
      const ym = k.slice(0,7);
      if(!rmonths[ym]) rmonths[ym] = {mu:remote.updatedAt||1, days:{}};
      if(!rmonths[ym].days[k]) rmonths[ym].days[k] = remote.days[k];
    });
  }
  return mergeRemote(remote, rmonths);
}

const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===================== day records ===================== */
function scheduledOn(t,k){ return t.created <= k && (!t.deleted || t.deleted > k) && t.days.indexOf(weekday(k)) >= 0; }
function itemFrom(t){ return {id:t.id, name:t.name, stat:t.stat, rank:t.rank, done:false}; }

function statusOf(k, today){
  today = today || todayKey();
  if(k > today) return "future";
  const rec = S.days[k];
  if(!rec) return "none";
  if(rec.pass) return "pass";
  if(!rec.items.length) return "rest";
  if(rec.items.every(i=>i.done)) return "clear";
  return k < today ? "fail" : "active";
}

function ensureDays(){
  const today = todayKey(), starts = [];
  if(S.tasks.length) starts.push(S.tasks.reduce((m,t)=> t.created < m ? t.created : m, S.tasks[0].created));
  if(S.sys.on && S.sys.start) starts.push(S.sys.start);
  if(!starts.length) return false;
  let changed = false;
  for(let k = starts.sort()[0]; k <= today; k = addDays(k,1)){
    if(!S.days[k]){
      const cust = S.tasks.filter(t=>scheduledOn(t,k)).map(itemFrom);
      const sys = (S.sys.on && S.sys.start && k >= S.sys.start) ? genSys(k) : [];
      S.days[k] = {items: sys.concat(cust)};
      touch(k); invalidate(); changed = true;
    }
  }
  return changed;
}

/* ===================== System engine ===================== */
function deload(R){
  R.deloads++;
  LAD_ORDER.forEach(l=>{ const s=R.lad[l], L=LADDERS[l].levels[s.lv]; s.val = Math.max(L.a, s.val - 2*L.st); s.hard = 0; });
}
function applySession(R, g, r){
  (GROUPS[g]||GROUPS.full).forEach(l=>{
    const s = R.lad[l], Ls = LADDERS[l].levels, cur = Ls[s.lv];
    if(r === "hard"){
      s.hard++;
      if(s.hard >= 2){ s.val = Math.max(cur.a, s.val - 2*cur.st); s.hard = 0; }
    } else {
      s.hard = 0; s.val += cur.st;
      if(s.val > cur.b){
        if(s.lv < Ls.length-1){ s.lv++; s.val = Ls[s.lv].a; }
        else if(cur.load){ s.load++; s.val = cur.a; }
        else s.val = cur.b;
      }
    }
  });
}
// Training state at the start of day k, rebuilt from history so it always matches what you actually did.
function replay(k){
  if(RC[k]) return RC[k];
  const today = todayKey(), lad = {};
  LAD_ORDER.forEach(l=>{ lad[l] = {lv:0, val:LADDERS[l].levels[0].a, load:0, hard:0}; });
  const R = {lad, sessions:0, deloads:0, phase:1};
  if(S.sys.start){
    let failRun = 0;
    for(let d = S.sys.start; d < k; d = addDays(d,1)){
      const rec = S.days[d];
      if(rec){
        const w = rec.items.find(i=>i.sys==="workout");
        if(w && w.done && w.r){ applySession(R, w.g, w.r); R.sessions++; if(R.phase===1 && R.sessions>=PHASE2_AT) R.phase = 2; }
      }
      const st = statusOf(d, today);
      if(st === "fail"){ failRun++; if(failRun % 2 === 0) deload(R); }
      else if(st === "clear" || st === "active") failRun = 0;
    }
  }
  RC[k] = R; return R;
}
function sysWeek(k, R){
  const raw = Math.max(0, Math.floor(diffDays(S.sys.start||k, k)/7));
  return {raw, week:Math.max(0, raw - R.deloads), easy: raw % 6 === 5};
}
function targets(k){
  const R = replay(k), W = sysWeek(k, R), wd = weekday(k), we = wd===0 || wd===6, w = W.week;
  return {
    R, W,
    steps: Math.min(10000, 6000 + 500*w),
    study: (we ? Math.min(420, 120 + 30*w) : Math.min(180, 60 + 15*w)) * 60,
    water: Math.min(3, 2 + 0.25*w),
    bedMin: Math.max(0, 60 - 15*w),
    med: Math.min(15, 5 + w) * 60,
    journal: w<2 ? "3 lines" : w<4 ? "5 lines" : w<6 ? "8 lines" : "half a page"
  };
}
function presc(T, l){
  const s = T.R.lad[l], Ls = LADDERS[l].levels, ex = Ls[s.lv];
  let sets = T.W.raw < 2 ? 2 : 3;
  if(s.lv >= Ls.length-2) sets = 4;
  if(T.W.easy) sets = Math.max(1, Math.ceil(sets/2));
  return {ex, sets, val:s.val, load:s.load, lv:s.lv, next:Ls[s.lv+1]||null, top:s.lv===Ls.length-1,
          prog: Math.min(1, (s.val - ex.a) / (ex.b - ex.a + ex.st))};
}
function unitText(ex, v){
  return ({"reps":v+" reps", "reps/leg":v+" reps per leg", "reps/side":v+" reps per side", "sec":v+" sec", "sec/side":v+" sec per side"})[ex.u];
}
function exName(p){ return p.ex.n + (p.load ? ` (+${p.load} book${p.load>1?"s":""})` : ""); }
function genSys(k){
  const R = replay(k), wd = weekday(k), items = [];
  let g = null, kind = null;
  if(R.phase === 1){ if(wd===1||wd===3||wd===5) g = "full"; else kind = wd===0 ? "stretch" : "mobility"; }
  else { if(wd===1||wd===4) g = "upper"; else if(wd===2||wd===5) g = "lower"; else kind = wd===0 ? "stretch" : "mobility"; }
  if(g) items.push({id:"sys-workout", sys:"workout", g, stat:"STR", rank:"A", done:false, r:null, sd:{}});
  else items.push({id:"sys-"+kind, sys:kind, stat:"STR", rank:kind==="stretch"?"E":"D", done:false});
  const we = wd===0 || wd===6;
  items.push({id:"sys-steps",   sys:"steps",   stat:"AGI", rank:"C", done:false});
  items.push({id:"sys-study",   sys:"study",   stat:"INT", rank:we?"A":"B", done:false, tm:{acc:0, at:null}});
  items.push({id:"sys-water",   sys:"water",   stat:"VIT", rank:"D", done:false});
  items.push({id:"sys-protein", sys:"protein", stat:"VIT", rank:"C", done:false});
  items.push({id:"sys-junk",    sys:"junk",    stat:"VIT", rank:"C", done:false});
  items.push({id:"sys-bed",     sys:"bed",     stat:"VIT", rank:"C", done:false});
  items.push({id:"sys-med",     sys:"med",     stat:"SPR", rank:"D", done:false, tm:{acc:0, at:null}});
  items.push({id:"sys-journal", sys:"journal", stat:"SPR", rank:"D", done:false});
  let n = 0, d = addDays(k,-1);
  while(S.sys.start && d >= S.sys.start && statusOf(d) === "fail"){ n++; d = addDays(d,-1); }
  if(n > 0) items.unshift({id:"sys-pen", sys:"penalty", stat:"AGI", rank:"A", done:false, m:Math.min(2, Math.pow(2, n-1))});
  if(wd === 0){
    items.push({id:"sys-weigh", sys:"weigh", stat:"VIT", rank:"E", done:false, kg:null});
    if(parseKey(k).getDate() <= 7) items.push({id:"sys-waist", sys:"waist", stat:"VIT", rank:"E", done:false, cm:null});
  }

}
const fmtDur = s => { const m = Math.round(s/60), h = Math.floor(m/60), r = m%60; return h ? (h+" hr"+(r?" "+r+" min":"")) : r+" min"; };
const fmtClock = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s/3600); return (h? h+":" : "") + pad(Math.floor(s%3600/60)) + ":" + pad(s%60); };
const bedText = m => m >= 60 ? "12:00 am" : "11:" + pad(m) + " pm";

}

function passesUsed(ym){ return Object.keys(S.days).filter(k=>k.slice(0,7)===ym && S.days[k].pass).length; }

/* ===================== derived progress ===================== */
const need = lv => 100 + (lv-1)*35;
function levelFrom(xp){ let lv=1, rem=xp; while(rem >= need(lv)){ rem -= need(lv); lv++; } return {level:lv, into:rem, need:need(lv)}; }
function rankOf(lv){ return lv>=60?"S":lv>=45?"A":lv>=30?"B":lv>=20?"C":lv>=10?"D":"E"; }
function titleOf(lv){ let t=TITLES[0][1]; for(const x of TITLES){ if(lv>=x[0]) t=x[1]; } return t; }
function clearBonus(streak){ return 50 + 10*Math.min(streak-1, 10); }

function derive(){
  const today = todayKey();
  const keys = Object.keys(S.days).filter(k=>k<=today).sort();
  let xp=0, streak=0, best=0, clears=0, fails=0, tasksDone=0, sDone=0, comeback=false, prev=null, todayBonus=0;
  const stats = {}; STATS.forEach(s=>stats[s.k]=10);
  const status = {};
  for(const k of keys){
    const rec = S.days[k];
    for(const i of rec.items){ if(i.done){ xp += XP[i.rank]||0; stats[i.stat] = (stats[i.stat]||10) + (PTS[i.rank]||1); tasksDone++; if(i.rank==="S") sDone++; } }
    const st = statusOf(k, today); status[k] = st;
    if(st==="clear"){ streak++; const b=clearBonus(streak); xp+=b; clears++; if(k===today) todayBonus=b; if(prev==="fail") comeback=true; }
    else if(st==="fail"){ streak=0; fails++; xp -= Math.min(50, levelFrom(xp).into); }
    if(st==="clear" || st==="fail") prev = st;
    best = Math.max(best, streak);
  }
  const L = levelFrom(xp);
  return {xp, streak, best, clears, fails, tasksDone, sDone, comeback, stats, status, todayBonus,
          level:L.level, into:L.into, need:L.need, rank:rankOf(L.level), title:titleOf(L.level)};
}

let actx = null;
function tone(seq){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    let t = actx.currentTime;
    seq.forEach(([f,d,type])=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type||"triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.12,t+0.015); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t+d+0.02); t += d*0.75;
    });
  }catch(e){}
}

  }

              : rec.pass ? "" : `<div class="warn">If any quest is left unchecked at midnight, today is marked as failed: your streak resets, you lose 50 XP${S.sys.on?", and a penalty quest is added tomorrow":""}.</div>`;

function tickCountdown(){

}

/* ===================== status ===================== */
function radar(stats){
  const cx=120, cy=118, R=82, n=STATS.length;
  const maxV = Math.max(40, ...Object.values(stats));
  const pt = (i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  const rv = s => R*Math.max(.06, stats[s.k]/maxV);
  let g="";
  [0.25,0.5,0.75,1].forEach(f=>{ g+=`<polygon points="${STATS.map((_,i)=>pt(i,R*f).join(",")).join(" ")}" fill="none" stroke="var(--line-soft)" stroke-width="1"/>`; });
  STATS.forEach((_,i)=>{ const p=pt(i,R); g+=`<line x1="${cx}" y1="${cy}" x2="${p[0]}" y2="${p[1]}" stroke="var(--line-soft)"/>`; });
  g += `<polygon points="${STATS.map((s,i)=>pt(i,rv(s)).join(",")).join(" ")}" fill="color-mix(in srgb, var(--accent) 28%, transparent)" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>`;
  STATS.forEach((s,i)=>{ const p=pt(i,rv(s)); g+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--accent)"/>`;
    const l=pt(i,R+20); g+=`<text x="${l[0]}" y="${l[1]+4}" text-anchor="middle">${s.k} ${stats[s.k]}</text>`; });
  return `<svg class="radar" viewBox="0 0 240 236" role="img" aria-label="Stat chart">${g}</svg>`;
}
function bodySeries(){
  const kg=[], cm=[], b=S.sys.base;
  if(b){ if(b.kg) kg.push({d:b.d, v:b.kg}); if(b.cm) cm.push({d:b.d, v:b.cm}); }
  Object.keys(S.days).sort().forEach(k=>S.days[k].items.forEach(i=>{
    if(i.sys==="weigh" && i.kg) kg.push({d:k, v:i.kg});
    if(i.sys==="waist" && i.cm) cm.push({d:k, v:i.cm});
  }));
  return {kg, cm};
}
function lineChart(pts, unit, color){
  if(pts.length < 2) return `<p class="sync-note">${pts.length ? `Starting point: ${pts[0].v} ${unit} on ${fmtShort(pts[0].d)}. Log more to see your trend.` : "No entries yet."}</p>`;
  const W=600, H=190, P=34, vs=pts.map(p=>p.v), mn=Math.min(...vs)-1, mx=Math.max(...vs)+1;
  const x = i => P + i*(W-2*P)/(pts.length-1), y = v => H-P - (v-mn)/(mx-mn)*(H-2*P);
  const path = pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${unit} trend">
    <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="var(--line-soft)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.v)}" r="4.5" fill="${color}"/>`).join("")}
    <text x="${x(0)}" y="${y(pts[0].v)-10}" text-anchor="start">${pts[0].v}</text>
    <text x="${x(pts.length-1)}" y="${y(pts[pts.length-1].v)-10}" text-anchor="end">${pts[pts.length-1].v} ${unit}</text>
    <text x="${P}" y="${H-10}" text-anchor="start">${fmtShort(pts[0].d)}</text>
    <text x="${W-P}" y="${H-10}" text-anchor="end">${fmtShort(pts[pts.length-1].d)}</text></svg>`;
}

function readName(){ const i=document.getElementById("f-name"); if(i) draft.name=i.value; }
function saveTask(){
  readName();
  const name = draft.name.trim();
  if(!name){ $("#f-err").textContent="Give the quest a name."; return; }
  if(!draft.days.length){ $("#f-err").textContent="Pick at least one day."; return; }
  const today = todayKey(), dow = weekday(today), wasEdit = !!draft.id;
  ensureDays();
  if(!S.days[today]) S.days[today] = {items:[]};
  const rec = S.days[today];
  if(draft.id){
    const t = S.tasks.find(x=>x.id===draft.id);
    Object.assign(t, {name, stat:draft.stat, rank:draft.rank, days:[...draft.days]});
    const idx = rec.items.findIndex(i=>i.id===t.id), onToday = t.days.indexOf(dow)>=0;
    if(idx>=0 && onToday) Object.assign(rec.items[idx], {name:t.name, stat:t.stat, rank:t.rank});
    else if(idx>=0 && !onToday) rec.items.splice(idx,1);
    else if(idx<0 && onToday) rec.items.push(itemFrom(t));
  } else {
    const t = {id:uid(), name, stat:draft.stat, rank:draft.rank, days:[...draft.days], created:today, deleted:null};
    S.tasks.push(t);
    if(t.days.indexOf(dow)>=0) rec.items.push(itemFrom(t));
  }
  if(!S.ack) S.ack = addDays(today,-1);
  save(); closeSheet(); SFX.tap(); afterChange(null);
  toast(wasEdit ? "Quest updated" : "Quest registered");
}
function deleteTask(){
  askConfirm({title:"Delete this quest?", body:"It will be removed from today and all future days. Past days keep their record.", yes:"Yes, delete quest", onYes:doDeleteTask, onNo:drawTaskSheet});
}
function doDeleteTask(){
  const today = todayKey();
  const t = S.tasks.find(x=>x.id===draft.id); if(!t) return;
  if(t.created===today) S.tasks = S.tasks.filter(x=>x.id!==t.id); else t.deleted = today;
  const rec = S.days[today]; if(rec) rec.items = rec.items.filter(i=>i.id!==t.id);
  save(); closeSheet(); afterChange(null); toast("Quest deleted");
}

/* ===================== backup ===================== */
function exportBackup(){
  try{
    const data = JSON.stringify({app:"ascend-quest", v:2, exported:new Date().toISOString(), state:S});
    const blob = new Blob([data], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ascend-quest-backup-" + todayKey() + ".json";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    S.lastBackup = todayKey(); save(); renderAll();
    if(sheetKind === "settings") settingsSheet();
    toast("Backup saved to your downloads");
  }catch(e){ toast("Backup failed. Try a different browser."); }
}
function importBackup(file){
  const r = new FileReader();
  r.onload = ()=>{
    let o = null;
    try{ o = JSON.parse(r.result); }catch(e){}
    const st = o && o.state;
    if(!st || typeof st !== "object" || !st.days || !Array.isArray(st.tasks)){ toast("That file isn’t a valid backup."); return; }
    askConfirm({safe:true, title:"Restore this backup?", body:"This replaces everything currently in the app with the backup" + (o.exported ? " from " + fmtLong(String(o.exported).slice(0,10)) : "") + ".", yes:"Restore backup",
      onYes:()=>{
        annQ.length = 0; annOpen = false; $("#announce").classList.remove("on");
        S = Object.assign(fresh(), st); normalize(); S.agreed = true; S.lastBackup = todayKey();
        invalidate(); ensureDays(); save(); closeSheet(); applyTheme(); renderAll(); toast("Backup restored");
      }, onNo:settingsSheet});
  };
  r.readAsText(file);
}
document.getElementById("imp").addEventListener("change", e=>{ const f = e.target.files && e.target.files[0]; if(f) importBackup(f); e.target.value = ""; });

/* ===================== announcements ===================== */
const annQ = []; let annOpen = false;
function announce(a){ annQ.push(a); if(!annOpen) nextAnn(); }
function nextAnn(){
  const a = annQ.shift();
  if(!a){ annOpen=false; $("#announce").classList.remove("on"); return; }
  annOpen = true;
  const w = $("#ann"); w.className = "win ann-win k-"+a.kind;
  w.innerHTML = `<div class="ann-kicker">${a.kicker}</div>${a.big||""}<div class="ann-title">${a.title}</div><div class="ann-body">${a.body||""}</div><button class="btn wide" data-act="ann-next">${a.btn||"Continue"}</button>`;
  $("#announce").classList.add("on");
  if(a.sfx) a.sfx();
  if(a.burst) burst(a.burst);
  setTimeout(()=>{ const b=w.querySelector("button"); if(b) b.focus(); }, 50);
}
function burst(color){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.createElement("div"); box.className="shards";
  for(let i=0;i<36;i++){
    const s=document.createElement("i"); s.className="shard";
    const ang=Math.random()*Math.PI*2, dist=140+Math.random()*260;
    s.style.setProperty("--dx", Math.cos(ang)*dist+"px"); s.style.setProperty("--dy", Math.sin(ang)*dist+"px");
    s.style.setProperty("--r", (Math.random()*720-360)+"deg");
    s.style.background = i%3 ? color : "var(--accent-2)";
    s.style.clipPath = "polygon(50% 0,100% 50%,50% 100%,0 50%)";
    box.appendChild(s);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 1300);
}
let toastT=null;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg;
  document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(), 2600);
}
function floatXP(el, txt, neg){
  if(!el) return;
  const r = el.getBoundingClientRect();
  const f = document.createElement("div"); f.className="float-xp"; f.textContent=txt;
  if(neg) f.style.color="var(--muted)";
  f.style.left = (r.right-50)+"px"; f.style.top = (r.top+r.height/2-14)+"px";
  document.body.appendChild(f); setTimeout(()=>f.remove(), 1000);
}

/* ===================== change handling ===================== */
function afterChange(before){
  const D = renderAll();
  if(before){
    const t = todayKey();
    if(D.status[t]==="clear" && before.status[t]!=="clear"){
      announce({kind:"clear", kicker:"Daily quest", title:"Quest complete", sfx:SFX.clear, burst:"var(--clear)",
        body:`All of today’s quests are done.<div class="rew"><div><span>Clear bonus</span><b>+${D.todayBonus} XP</b></div><div><span>Streak</span><b>🔥 ${D.streak}</b></div></div>`});
    }
    if(D.level > before.level){
      const rankUp = D.rank !== before.rank, titleUp = D.title !== before.title;
      announce({kind:"level", kicker:"Level up", big:`<div class="big-lv">${D.level}</div>`, title:"You leveled up", sfx:SFX.level, burst:"var(--gold)",
        body:`Level ${before.level} → ${D.level}${rankUp?`<div class="rew"><div><span>Rank</span><b>${before.rank} → ${D.rank}</b></div></div>`:""}${titleUp?`<div class="rew"><div><span>New title</span><b>${esc(D.title)}</b></div></div>`:""}`});
    }
  }
  checkAchievements(D);
  checkProgress();
}
function checkAchievements(D){
  let changed=false;
  ACHS.forEach(a=>{
    if(a.test(D) && S.seenAch.indexOf(a.id)<0){
      S.seenAch.push(a.id); changed=true;
      announce({kind:"ach", kicker:"Achievement unlocked", big:`<div style="font-size:3rem">${a.ic}</div>`, title:a.name, body:a.desc, sfx:SFX.check});
    }
  });
  if(changed) save();
}
function checkProgress(){
  if(!S.sys.on || !S.sys.start) return;
  const today = todayKey(), R = replay(addDays(today,1)), seen = S.sys.seen;
  let ch = false; const ups = [];
  LAD_ORDER.forEach(l=>{
    const cur = R.lad[l].lv, was = seen.lv[l] || 0;
    if(cur > was){
      seen.lv[l] = cur; ch = true;
      const ex = LADDERS[l].levels[cur];
      const special = l==="push" && cur===4 ? "Full push-ups unlocked" : l==="bar" && cur===5 ? "Chin-ups unlocked" : l==="bar" && cur===6 ? "Pull-ups unlocked" : null;
      if(special) announce({kind:"level", kicker:"Milestone", big:`<div style="font-size:3rem">🏆</div>`, title:special, sfx:SFX.level, burst:"var(--gold)",
        body:`${LADDERS[l].label} ladder, level ${cur+1}. From your next workout: ${ex.n}, starting at ${unitText(ex,ex.a)} per set.`});
      else ups.push({l, ex, cur});
    } else if(cur < was){ seen.lv[l] = cur; ch = true; }
  });
  if(ups.length === 1){ const u = ups[0];
    announce({kind:"level", kicker:"New exercise unlocked", big:`<div style="font-size:3rem">⬆️</div>`, title:u.ex.n, sfx:SFX.level, burst:"var(--gold)",
      body:`${LADDERS[u.l].label} ladder, level ${u.cur+1}. From your next workout, starting at ${unitText(u.ex,u.ex.a)} per set.`});
  } else if(ups.length > 1){
    announce({kind:"level", kicker:"Training upgrade", big:`<div style="font-size:3rem">⬆️</div>`, title:ups.length+" new exercises unlocked", sfx:SFX.level, burst:"var(--gold)",
      body:`From your next workout:<div class="rew">${ups.map(u=>`<div><span>${LADDERS[u.l].label}</span><b>${u.ex.n}</b></div>`).join("")}</div>`});
  }
  if(R.deloads > seen.deloads){
    seen.deloads = R.deloads; ch = true;
    announce({kind:"fail", kicker:"Deload", title:"Training load reduced", sfx:SFX.fail, btn:"Accept",
      body:"Two failed days in a row. The System has stepped every System quest back one stage. Earn it back."});
  }
  if(R.phase > seen.phase){
    seen.phase = R.phase; ch = true;
    announce({kind:"level", kicker:"Class change", big:`<div style="font-size:3rem">⚔️</div>`, title:"Phase 2 unlocked", sfx:SFX.level, burst:"var(--gold)",
      body:`You’ve completed ${PHASE2_AT} strength sessions. Training now splits into upper-body days (Mon, Thu) and lower-body days (Tue, Fri), so each session can go deeper.`});
  }
  const B = bodySeries();
  const mile = (arr, steps, unit, label) => {
    if(arr.length < 2) return;
    const drop = arr[0].v - Math.min(...arr.map(p=>p.v));
    steps.forEach(x=>{
      const id = unit + x;
      if(drop >= x && seen.ms.indexOf(id) < 0){
        seen.ms.push(id); ch = true;
        announce({kind:"ach", kicker:"Body milestone", big:`<div style="font-size:3rem">🏅</div>`, title:`${x} ${unit} ${label}`, sfx:SFX.clear, burst:"var(--accent-2)",
          body:`Down ${x} ${unit} from your starting point of ${arr[0].v} ${unit}. Keep going.`});
      }
    });
  };
  mile(B.kg, [5,10,15,20,25], "kg", "lost");
  mile(B.cm, [5,10,15], "cm", "off your waist");
  if(seen.ms.indexOf("10k") < 0){
    let ok = true;
    for(let i=0;i<7;i++){
      const k = addDays(today,-i), rec = S.days[k];
      const s = rec && rec.items.find(x=>x.sys==="steps");
      if(!s || !s.done || k < S.sys.start || targets(k).steps < 10000){ ok = false; break; }
    }
    if(ok){ seen.ms.push("10k"); ch = true; announce({kind:"ach", kicker:"Milestone", big:`<div style="font-size:3rem">👟</div>`, title:"First 10k-step week", body:"Seven days in a row at 10,000 steps.", sfx:SFX.clear}); }
  }
  if(ch) save();
}

function setDone(id, val, el){
  const today = todayKey(); ensureDays();
  const rec = S.days[today]; if(!rec) return;
  const it = rec.items.find(i=>i.id===id); if(!it || it.done===val) return;
  const before = derive();
  it.done = val; lastToggled = id;
  save();
  if(val){ SFX.check(); floatXP(el, "+"+XP[it.rank]+" XP"); } else { SFX.uncheck(); floatXP(el, "−"+XP[it.rank]+" XP", true); }
  afterChange(before);
}
function toggle(id, el){ const it = todayItem(id); if(it) setDone(id, !it.done, el); }
function openSys(id){
  const it = todayItem(id); if(!it) return;
  if(it.sys==="workout") workoutSheet();
  else if(it.sys==="study" || it.sys==="med") timerSheet(id);
  else if(it.sys==="mobility" || it.sys==="stretch") routineSheet(id);
  else if(it.sys==="weigh" || it.sys==="waist") measureSheet(id);
}

/* ===================== rollover / penalties ===================== */
function checkMissed(){
  const today = todayKey(), y = addDays(today,-1);
  if(!S.tasks.length && !S.sys.on) return;
  if(!S.ack){ S.ack = y; save(); return; }
  if(S.ack >= y) return;
  const D = derive(); const missed = [];
  for(let k=addDays(S.ack,1); k<=y; k=addDays(k,1)){ if(D.status[k]==="fail") missed.push(k); }
  S.ack = y; save();
  if(missed.length){
    const last = S.days[missed[missed.length-1]];
    const left = last ? last.items.filter(i=>!i.done).length : 0;
    const extra = ` You lost ${missed.length>1?"50 XP for each failed day":"50 XP"}.` + (S.sys.on ? " A penalty quest has been added to today. Clear it, or it doubles tomorrow." : "");
    announce({kind:"fail", kicker:"Penalty", title: missed.length===1 ? "Quest failed" : missed.length+" days failed", sfx:SFX.fail,
      body: (missed.length===1 ? `${fmtLong(missed[0])}: ${left} quest${left===1?"":"s"} left unfinished. Your streak has been reset.`
                               : `You missed ${missed.length} days, most recently ${fmtLong(missed[missed.length-1])}. Your streak has been reset.`) + extra,
      btn:"Accept"});
  }
}
let curDay = todayKey();
function dayWatch(){
  tickCountdown(); tickTimers(); tickRest();
  const t = todayKey();
  if(t !== curDay){ curDay = t; invalidate(); ensureDays(); save(); if(sheetKind==="workout"||sheetKind==="timer") closeSheet(); renderAll(); checkMissed(); checkProgress(); toast("A new day has begun. New quests issued."); }
}

/* ===================== wipe ===================== */
function wipeAll(){
  annQ.length = 0; annOpen = false; $("#announce").classList.remove("on");
  if(cloud) Object.keys(pushed).forEach(ym=>{ const ref = cloud.months.doc(ym); chains[ref.path] = (chains[ref.path]||Promise.resolve()).then(()=>ref.delete()).catch(()=>{}); delete pushed[ym]; });
  S = fresh(); normalize();
  save();
  applyTheme(); closeSheet(); showView("quest");
  calY = new Date().getFullYear(); calM = new Date().getMonth();
  renderAll(); onboard(); toast("All data deleted");
}

/* ===================== events ===================== */
function showView(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on", b.dataset.view===v));
  window.scrollTo({top:0});
}
document.addEventListener("click", e=>{
  const tab = e.target.closest(".tab"); if(tab){ showView(tab.dataset.view); return; }
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case "toggle": toggle(b.dataset.id, b); break;
    case "open-sys": openSys(b.dataset.id); break;
    case "add-task": taskSheet(null); break;
    case "edit-task": taskSheet(S.tasks.find(t=>t.id===b.dataset.id)); break;
    case "close": closeSheet(); break;
    case "f-stat": readName(); draft.stat=v; drawTaskSheet(); break;
    case "f-rank": readName(); draft.rank=v; drawTaskSheet(); break;
    case "f-day": { readName(); const n=+v, i=draft.days.indexOf(n); if(i>=0) draft.days.splice(i,1); else draft.days.push(n); drawTaskSheet(); break; }
    case "f-days": readName(); draft.days = v==="all"?[0,1,2,3,4,5,6]:v==="wk"?[1,2,3,4,5]:[0,6]; drawTaskSheet(); break;
    case "f-save": saveTask(); break;
    case "f-delete": deleteTask(); break;
    case "s-theme": keepName(); S.theme=v; applyTheme(); save(); renderAll(); settingsSheet(); break;
    case "s-sound": keepName(); S.sound = v==="on"; save(); settingsSheet(); if(S.sound) SFX.tap(); break;
    case "s-save": { const n=$("#s-name").value.trim(); if(n) S.name=n; save(); closeSheet(); renderAll(); break; }
    case "s-reset":
      keepName();
      askConfirm({title:"Are you sure you want to delete everything?", body:"This permanently erases your name, every quest, your calendar history, levels, stats, training progress, body measurements, streaks and achievements. The app will start again from the very first screen. This can’t be undone.", yes:"Yes, delete everything", onYes:wipeAll, onNo:settingsSheet});
      break;
    case "c-yes": { const p = pendingConfirm; pendingConfirm = null; if(p) p.onYes(); break; }
    case "c-no": { const p = pendingConfirm; pendingConfirm = null; if(p && p.onNo) p.onNo(); else closeSheet(); break; }
    case "sys-offer": sysOfferSheet(); break;
    case "backup": exportBackup(); break;
    case "restore": document.getElementById("imp").click(); break;
    case "agree": S.agreed = true; save(); closeSheet(); onboard(); break;
    case "test-next": try{ localStorage.setItem(OFF_KEY, String(OFF+1)); }catch(e){} location.reload(); break;
    case "test-reset": try{ localStorage.removeItem(OFF_KEY); localStorage.removeItem(LS_KEY); }catch(e){} location.reload(); break;
    case "sys-later": S.sys.offered = true; save(); closeSheet(); toast("You can turn on System mode anytime in Settings"); break;
    case "sys-on": activateSys(); break;
    case "sys-off": askConfirm({title:"Turn off System mode?", body:"System quests will stop appearing, starting today. Your training progress is kept, and turning it back on continues where you left off.", yes:"Turn off", onYes:deactivateSys, onNo:settingsSheet}); break;
    case "pass-on": {
      askConfirm({safe:true, title:"Use a sick pass today?", body:"Use this only when you’re genuinely ill or injured. Today will count as a rest day: no streak loss, no XP penalty, no penalty quest tomorrow. You get 2 per month.", yes:"Use sick pass",
        onYes:()=>{ const r=S.days[todayKey()]; if(r){ r.pass=true; r.items.forEach(i=>{ if(i.tm && i.tm.at){ i.tm.acc=elapsed(i); i.tm.at=null; } }); } save(); closeSheet(); renderAll(); toast("Sick pass used. Rest well."); }});
      break;
    }
    case "pass-off": { const r=S.days[todayKey()]; if(r){ r.pass=false; save(); renderAll(); toast("Sick pass cancelled"); } break; }
    case "set": {
      const it = todayItem("sys-workout"); if(!it || it.done) break;
      const l = b.dataset.l, j = +b.dataset.j, dn = it.sd[l]||0;
      it.sd[l] = j < dn ? j : j+1;
      const T = targets(todayKey()), p = presc(T,l);
      if(it.sd[l] > dn){
        SFX.tap();
        const allDone = GROUPS[it.g].every(x=>(it.sd[x]||0) >= presc(T,x).sets);
        if(it.sd[l] < p.sets && !allDone){ restTotal = LADDERS[l].rest || 60; restEnd = Date.now() + restTotal*1000; }
        else restEnd = 0;
      }
      save(); workoutSheet(); break;
    }
    case "w-all": { const it = todayItem("sys-workout"); if(!it) break; const T = targets(todayKey()); GROUPS[it.g].forEach(l=>{ it.sd[l] = presc(T,l).sets; }); restEnd = 0; save(); workoutSheet(); break; }
    case "rest-skip": restEnd = 0; tickRest(); break;
    case "rate": {
      const it = todayItem("sys-workout"); if(!it) break;
      const before = derive();
      it.r = v; it.done = true; restEnd = 0;
      save(); closeSheet(); SFX.check(); afterChange(before);
      toast(v==="hard" ? "Logged. Same targets next time." : "Logged. Targets go up next session.");
      break;
    }
    case "w-undo": { const it = todayItem("sys-workout"); if(!it) break; const before = derive(); it.done = false; it.r = null; save(); afterChange(before); workoutSheet(); break; }
    case "tm-toggle": {
      const it = todayItem(timerId); if(!it) break;
      if(it.tm.at){ it.tm.acc = elapsed(it); it.tm.at = null; } else { it.tm.at = Date.now(); SFX.tap(); }
      save(); renderAll(); timerSheet(timerId); break;
    }
    case "tm-add": {
      const it = todayItem(timerId); if(!it) break;
      it.tm.acc += 900; save(); renderAll(); timerSheet(timerId); tickTimers(); break;
    }
    case "tm-reset": {
      const it = todayItem(timerId); if(!it) break;
      const before = derive(); it.tm = {acc:0, at:null};
      if(it.done){ it.done = false; save(); afterChange(before); } else { save(); renderAll(); }
      timerSheet(timerId); break;
    }
    case "rt-done": { const it = todayItem(b.dataset.id); if(!it) break; closeSheet(); setDone(it.id, !it.done); break; }
    case "m-save": saveMeasure(b.dataset.id); break;
    case "day": daySheet(b.dataset.k); break;
    case "goto-quest": closeSheet(); showView("quest"); break;
    case "cal-prev": calM--; if(calM<0){calM=11;calY--;} renderCalendar(derive()); break;
    case "cal-next": calM++; if(calM>11){calM=0;calY++;} renderCalendar(derive()); break;
    case "ann-next": nextAnn(); break;
    case "onboard": {
      const n = $("#o-name").value.trim();
      if(!n){ $("#o-err").textContent="Enter a name to continue."; return; }
      S.name=n; save(); closeSheet(); renderAll(); SFX.level();
      announce({kind:"level", kicker:"System", title:"Welcome, "+esc(n), body:"Clear every quest before midnight, every day, and you will grow stronger. Miss one, and the day is failed.", btn:"Continue"});
      if(!S.sys.offered) sysOfferSheet();
      break;
    }
  }
});

function daySheet(k){
  const D = derive(), rec = S.days[k], today = todayKey(), st = k>today ? "future" : (D.status[k]||"none");
  const lab = {clear:["Cleared","var(--clear)"], fail:["Failed","var(--fail)"], active:["In progress","var(--accent)"], rest:["Rest day","var(--muted)"], none:["No quests","var(--muted)"], future:["Upcoming","var(--muted)"], pass:["Sick pass","var(--accent-2)"]}[st];
  let body = "";
  if(k>today){
    const items = S.tasks.filter(t=>!t.deleted && t.days.indexOf(weekday(k))>=0);
    body = (S.sys.on ? `<p class="sync-note">System quests will be generated on the day, based on your progress.</p>` : "") +
      (items.length ? `<p class="sync-note">Your scheduled quests:</p><ul class="day-items">${items.map(t=>`<li><span>◇</span>${esc(t.name)}</li>`).join("")}</ul>` : (S.sys.on?"":`<p class="sync-note">Nothing scheduled.</p>`));
  } else if(rec && rec.items.length){
    const T = rec.items.some(i=>i.sys) ? targets(k) : null;
    body = `<ul class="day-items">${rec.items.map(i=>{
      const nm = i.sys ? sysView(i,T).name : i.name;
      return `<li>${i.done?'<span class="ok">✓</span>':'<span class="no">✕</span>'}<span style="flex:1">${esc(nm)}</span><span class="tag rk rk-${i.rank}">${i.rank}</span></li>`; }).join("")}</ul>`;
  } else body = `<p class="sync-note">No quests were scheduled.</p>`;
  openSheet(`<div class="win-title"><span class="bang">!</span>${fmtLong(k)}</div>
    <p><span class="status-badge" style="color:${lab[1]}">${lab[0]}</span></p>${body}
    <div class="row-btns">${k===today?`<button class="btn ghost" data-act="goto-quest">Open today’s quest</button>`:""}<button class="btn" data-act="close">Close</button></div>`, "day");
}

$("#btn-theme").addEventListener("click", ()=>{ S.theme = {auto:"light", light:"dark", dark:"auto"}[S.theme]||"auto"; applyTheme(); save(); renderTop(derive()); toast("Theme: "+(S.theme==="auto"?"match device":S.theme)); });
$("#btn-settings").addEventListener("click", settingsSheet);
$("#scrim").addEventListener("click", e=>{ if(e.target.id==="scrim" && sheetKind!=="onboard") closeSheet(); });
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(annOpen) nextAnn(); else if(sheetKind!=="onboard") closeSheet(); }
  if(e.key==="Enter" && e.target.id==="f-name") saveTask();
  if(e.key==="Enter" && e.target.id==="o-name"){ const b=document.querySelector('[data-act="onboard"]'); if(b) b.click(); }
});
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) dayWatch(); });

function onboard(){
  if(!S.agreed){
    openSheet(`<div class="win-title"><span class="bang">!</span>Before you begin</div>
      <p style="font-family:var(--display);font-size:1.35rem;font-weight:700;margin:0 0 10px">Welcome to ${APP_NAME}.</p>
      <div class="warn" style="margin-top:0"><b style="font-family:var(--display)">Not medical advice.</b> This app is a motivation and habit tool. Talk to a doctor before starting a new exercise or diet routine, especially if you have a health condition, injury or are overweight. Stop any exercise that causes sharp pain.</div>
      <div class="warn ok"><b style="font-family:var(--display)">Your data stays on this device.</b> There is no account or cloud sync. Progress is saved in this browser only, so clearing browser data or switching browsers erases it. Use Settings → Back up progress regularly.</div>
      <div class="row-btns"><button class="btn wide" data-act="agree">I understand, continue</button></div>`, "onboard");
    return;
  }
  if(S.name){ if(!S.sys.offered && !S.sys.on) sysOfferSheet(); return; }
  openSheet(`<div class="win-title"><span class="bang">!</span>System notice</div>
    <div style="text-align:center;margin:6px 0 18px">${emblem("E",88)}</div>
    <p style="font-family:var(--display);font-size:1.3rem;font-weight:700;margin:0 0 6px;text-align:center">The System has chosen you.</p>
    <p class="sync-note" style="text-align:center;margin:0 0 18px">Clear daily quests, grow stronger every day. Miss one, and the day is failed.</p>
    <div class="field"><label for="o-name">Your player name</label><input class="inp" id="o-name" maxlength="30" placeholder="Enter your name" autocomplete="off"><div class="err" id="o-err"></div></div>
    <button class="btn wide" data-act="onboard">Accept</button>`, "onboard");
}

/* ===================== boot ===================== */
function boot(){
  applyTheme();
  if(ensureDays()) save();
  renderAll();
  checkMissed();
  checkProgress();
  onboard();
}
boot();
setInterval(dayWatch, 1000);

/* Offline support and home-screen install (only when served from a website) */
if("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener("load", ()=>{ navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
/* Ask the browser to keep this app's data (helps on phones) */
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
/* Test mode bar */
if(TEST){
  const tb = document.createElement("div"); tb.className = "test-bar";
  tb.innerHTML = `<span>Test mode · day +${OFF}</span><button data-act="test-next">Next day ›</button><button class="ghost" data-act="test-reset">Reset</button>`;
  document.body.appendChild(tb);
}
})();

</script>
</body>
</html>
